<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ECab8"/>
      <stop offset="100%" stop-color="#2BB0A0"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Notebook body -->
  <rect x="130" y="110" width="230" height="290" rx="18" fill="white" opacity="0.95"/>

  <!-- Spine binding strip -->
  <rect x="130" y="110" width="38" height="290" rx="14" fill="white" opacity="0.4"/>

  <!-- Binding rings -->
  <circle cx="149" cy="180" r="13" fill="none" stroke="#2BB0A0" stroke-width="10"/>
  <circle cx="149" cy="256" r="13" fill="none" stroke="#2BB0A0" stroke-width="10"/>
  <circle cx="149" cy="332" r="13" fill="none" stroke="#2BB0A0" stroke-width="10"/>

  <!-- Ruled lines on page -->
  <line x1="188" y1="195" x2="332" y2="195" stroke="#2BB0A0" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <line x1="188" y1="230" x2="332" y2="230" stroke="#2BB0A0" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <line x1="188" y1="265" x2="300" y2="265" stroke="#2BB0A0" stroke-width="8" stroke-linecap="round" opacity="0.35"/>

  <!-- Pen body (angled, lower-right) -->
  <g transform="rotate(-40 340 340)">
    <rect x="308" y="230" width="32" height="110" rx="10" fill="white" opacity="0.92"/>
    <!-- Pen clip -->
    <rect x="322" y="228" width="8" height="80" rx="4" fill="white" opacity="0.5"/>
    <!-- Pen tip -->
    <polygon points="308,340 340,340 324,378" fill="white" opacity="0.85"/>
    <!-- Pen tip nib -->
    <polygon points="316,364 332,364 324,378" fill="#2BB0A0"/>
  </g>
</svg>
